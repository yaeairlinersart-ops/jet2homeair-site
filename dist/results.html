<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b5d3b"><title>选择航班 · 耀天航空 Jet2Home Air</title>
  <link rel="stylesheet" href="results.css"><link rel="stylesheet" href="disclaimer.css"><script src="disclaimer.js" defer></script><script src="results.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="返回耀天航空首页"><svg class="brand-mark" viewBox="0 0 850.39 850.39" aria-hidden="true" style="color:#075c38"><path d="M421.3,72.14c13.88-1.17,27.81,4.16,38.4,12.89l317.59,291.34c41.1,47.18-15.58,112.84-68.11,78.61L425.47,195.71,141.22,454.98c-52.53,34.22-109.22-31.42-68.11-78.61L389.94,85.78c8.76-7.59,19.7-12.66,31.36-13.64Z" fill="currentColor"/><path d="M413.8,386.59c146.34-8.41,250.36,141.66,190.52,276.01-61.73,138.61-252.57,156.92-339.77,32.52-88.06-125.64-3.3-299.77,149.24-308.53ZM423.56,490.81c-74.09,1.33-115.69,85.85-72.15,145.95,38.21,52.74,119.21,48.67,152.38-7.19,36.61-61.65-8.64-140.05-80.23-138.76Z" fill="currentColor"/></svg><span>耀天航空<small>Jet2Home Air</small></span></a>
    <div class="search-summary" aria-label="当前搜索条件">
      <div class="route-mini"><strong id="summary-from-city">昆明</strong><span>················ ✈</span><strong id="summary-to-city">陇川（瑞丽）</strong><small id="summary-route">KMG 至 LCS</small></div>
      <div><small>出发</small><b id="summary-date">—</b></div>
      <div><small>乘客</small><b id="summary-passengers">1 位成人</b></div>
    </div>
    <a class="booking-link" href="#flight-results"><span>▰</span> 我的预订</a>
  </header>
  <div class="modify-bar"><button id="modify-search" type="button" aria-expanded="false" aria-controls="modify-panel">修改搜索 <span>⌄</span></button></div>
  <section id="modify-panel" class="modify-panel" hidden>
    <form id="modify-form">
      <div class="modify-trip" role="radiogroup" aria-label="行程类型"><label><input type="radio" name="modify-trip" value="one-way"> 单程</label><label><input type="radio" name="modify-trip" value="round-trip"> 往返</label></div>
      <div class="modify-grid">
        <label>从<select id="modify-from" aria-label="修改出发地"></select></label>
        <button id="modify-swap" type="button" aria-label="交换出发地与目的地">⇄</button>
        <label>到<select id="modify-to" aria-label="修改目的地"></select></label>
        <label>去程日期<input id="modify-date" type="date" required></label>
        <label id="modify-return-wrap" hidden>返程日期<input id="modify-return" type="date"></label>
        <label>乘客<select id="modify-passengers"><option>1 位成人</option><option>2 位成人</option><option>3 位成人</option><option>4 位成人</option></select></label>
        <label>舱位<select disabled><option>经济舱</option></select></label>
      </div>
      <button class="modify-submit" type="submit">更新搜索</button>
    </form>
  </section>

  <main>
    <div class="page-heading"><p>SELECT YOUR FLIGHT</p><h1 id="page-title">请选择您的去程航班</h1><span id="page-route">昆明 至 陇川（瑞丽）</span></div>

    <section class="date-browser" aria-label="选择出发日期">
      <button id="previous-days" type="button" aria-label="查看之前的日期">‹<span>前一天</span></button>
      <div id="date-strip" class="date-strip"></div>
      <button id="next-days" type="button" aria-label="查看之后的日期"><span>后一天</span>›</button>
      <div class="legend"><i></i> 有直飞航班</div>
    </section>

    <div class="results-tools"><div><button class="filter-button" type="button">☷&nbsp;&nbsp;筛选</button><strong id="flight-count">1 个航班</strong></div><label>排序方式 <select aria-label="航班排序方式"><option>推荐顺序</option><option>起飞时间</option><option>价格</option></select></label></div>

    <section id="flight-results" aria-live="polite"></section>
  </main>

  <template id="flight-card-template">
    <article class="flight-card">
      <div class="flight-main">
        <div class="flight-times"><div><time class="depart-time">07:00</time><strong class="from-city">昆明</strong><small><span class="from-airport">长水国际机场</span><em class="from-code">KMG</em></small></div><div class="flight-line"><span>直飞</span><i></i><small class="duration">1小时30分</small></div><div><time class="arrive-time">08:30</time><strong class="to-city">陇川（瑞丽）</strong><small><span class="to-airport">广宋机场</span><em class="to-code">LCS</em></small></div></div>
        <div class="flight-meta"><span>✈</span><div><b>耀天航空 · Jet2Home Air</b><small class="flight-number">JH1201 · 运-12F</small></div><button class="details-button" type="button">查看航班详情⌄</button></div>
        <div class="flight-details" hidden><span>托运行李以所选票价规则为准</span><span>全程由运-12F执飞</span><span>计划过站时间40分钟</span></div>
      </div>
      <button class="fare economy" type="button"><small>经济舱</small><span>¥ <b class="price">299</b></span><em>含附加费</em><i>⌄</i></button>
      <div class="fare premium"><small>超级经济舱</small><span class="unavailable">—</span></div>
      <section class="fare-selector" hidden>
        <header><div><small>SELECT A FARE</small><h2>选择经济舱票价</h2></div><button class="close-fares" type="button" aria-label="收起票价选择">收起⌃</button></header>
        <div class="fare-grid">
          <button class="fare-choice discount-fare" type="button"><span class="fare-name">优惠经济舱</span><strong>¥<b class="discount-price">289</b></strong><small>含附加费 · 比基础价省¥10</small><ul><li>✓ 仅含手提行李</li><li class="not-included">— 不含托运行李额度</li><li class="not-included">— 不含机上餐食</li></ul><em>选择此票价</em></button>
          <button class="fare-choice basic-fare recommended" type="button"><span class="fare-badge">推荐</span><span class="fare-name">基础经济舱</span><strong>¥<b class="base-price">299</b></strong><small>含附加费</small><ul><li>✓ 含手提行李</li><li>✓ 含托运行李额度</li><li class="not-included">— 不含机上餐食</li></ul><em>选择此票价</em></button>
          <div class="fare-choice preferred-fare unavailable-fare" aria-disabled="true"><span class="fare-name">优选经济舱</span><strong>—</strong><small>其他机型为基础价 + ¥15</small><ul><li>✓ 含手提及托运行李</li><li>✓ 提供机上餐食并可选餐</li><li>× 运-12F不提供此票价</li></ul><em>当前航班不可选</em></div>
        </div>
      </section>
    </article>
  </template>
  <dialog id="fare-confirm-dialog">
    <button class="fare-dialog-close" type="button" aria-label="关闭票价提示">×</button>
    <small class="dialog-eyebrow">FARE DETAILS</small><h2 id="fare-dialog-title">基础经济舱</h2>
    <p id="fare-dialog-route">昆明 至 陇川（瑞丽） · 运-12F</p>
    <div class="fare-dialog-price">每位旅客 <strong>¥<span id="fare-dialog-price">299</span></strong><small>含附加费</small></div>
    <h3>请确认行李和餐食规则</h3><div id="fare-dialog-benefits" class="fare-dialog-benefits"></div>
    <p class="fare-dialog-note">所选票价适用于本次航段的所有旅客。实际行李尺寸与安全要求以乘机提示为准。</p>
    <div class="fare-dialog-actions"><button id="fare-dialog-back" type="button">返回修改</button><button id="fare-dialog-confirm" type="button">确认此票价</button></div>
  </dialog>
  <style>
    main{margin-top:24px;margin-bottom:70px}
    .page-heading h1{font-size:31px}
    .date-browser{margin-top:24px;min-height:168px;padding-top:17px;padding-bottom:35px}
    .date-option{height:96px;padding-top:9px}.date-option b{white-space:nowrap;font-size:14px;letter-spacing:-.3px}
    .date-option span{margin-top:3px}.date-option small{margin-top:3px;font-size:11px;font-weight:600}
    .legend{bottom:9px}
    .results-tools{margin-top:20px;margin-bottom:13px}
    .flight-main{padding:20px 28px}
    .flight-meta{margin-top:13px;padding-top:11px}.flight-details[hidden]{display:none!important}
    .fare{min-height:176px}.fare .price{font-size:34px}
    .route-mini strong{font-family:var(--font);font-size:18px;white-space:nowrap}.flight-times>div>strong{font-family:var(--font);font-size:15px;color:var(--deep)}.flight-times>div>small em{margin-left:7px;padding-left:7px;border-left:1px solid #c8d2cc;color:#7f8c85;font:600 9px Arial;font-style:normal}
    .modify-bar button{border:0;background:#fff;color:var(--green);font-weight:700;padding:10px 30px;cursor:pointer}.modify-bar button span{display:inline-block;margin-left:3px;transition:transform .2s}.modify-bar button[aria-expanded="true"] span{transform:rotate(180deg)}
    .modify-panel{width:min(1160px,91%);margin:0 auto 20px;padding:24px 28px;border:1px solid var(--line);border-top:0;box-shadow:0 10px 25px #173f2b12;background:#fff}.modify-panel[hidden],#modify-return-wrap[hidden]{display:none!important}.modify-trip{display:flex;gap:30px;margin-bottom:18px}.modify-trip label{display:flex;align-items:center;gap:7px}.modify-trip input{width:18px;height:18px;accent-color:var(--green)}.modify-grid{display:grid;grid-template-columns:1.2fr 42px 1.2fr 1fr 1fr 1fr;align-items:end;gap:16px}.modify-grid label{display:flex;min-width:0;flex-direction:column;gap:5px;color:#617168;font-size:11px}.modify-grid select,.modify-grid input{width:100%;height:42px;border:0;border-bottom:1px solid #718078;background:#fff;color:var(--ink);font-size:13px}.modify-grid select:disabled{color:var(--ink);opacity:1}.modify-grid #modify-swap{height:42px;border:0;background:transparent;color:var(--green);font-size:25px}.modify-submit{display:block;margin:22px 0 0 auto;padding:12px 30px;border:0;background:var(--green);color:#fff;font-weight:700;cursor:pointer}
    .fare-selector{grid-column:1/-1;padding:24px 30px 30px;border-top:1px solid var(--line);background:#f8faf9}.fare-selector[hidden]{display:none!important}.fare-selector>header{display:flex;align-items:end;justify-content:space-between;margin-bottom:18px}.fare-selector header small{color:#809088;font:9px Arial;letter-spacing:1.5px}.fare-selector h2{margin:2px 0 0;font-size:22px;color:var(--deep)}.close-fares{border:0;background:transparent;color:var(--green);font-weight:600}.fare-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.fare-choice{position:relative;min-height:248px;padding:20px;border:1px solid #cad6cf;background:#fff;color:var(--ink);text-align:left}.fare-choice:not(.unavailable-fare){cursor:pointer}.fare-choice:hover:not(.unavailable-fare),.fare-choice.selected{border-color:var(--green);box-shadow:0 7px 20px #0b5d3b17}.fare-choice.recommended{border-width:2px;border-color:var(--green)}.fare-badge{position:absolute;right:12px;top:12px;padding:3px 8px;background:#e8f2ed;color:var(--green);font-size:9px}.fare-name{display:block;font-size:16px;font-weight:700}.fare-choice>strong{display:block;margin-top:9px;color:var(--deep);font-size:16px}.fare-choice>strong b{font-size:31px}.fare-choice>small{display:block;color:#839088;font-size:9px}.fare-choice ul{list-style:none;margin:18px 0 45px;padding:14px 0 0;border-top:1px solid #e0e6e2;font-size:11px;line-height:2}.fare-choice li.not-included{font-size:13px;font-weight:700;line-height:1.8;color:#203c30}.fare-choice>em{position:absolute;left:20px;right:20px;bottom:17px;padding:8px;background:var(--green);color:#fff;font-style:normal;font-size:11px;text-align:center}.unavailable-fare{background:#f1f3f2;color:#7f8a84}.unavailable-fare>em{background:#c6ceca;color:#68736d}.unavailable-fare>strong{font-size:31px;color:#8f9994}
    #fare-confirm-dialog{width:min(720px,92%);padding:35px 40px;border:0;border-radius:5px;color:var(--ink);box-shadow:0 25px 80px #0a2d2050;font-family:var(--font)}#fare-confirm-dialog::backdrop{background:#17251f90;backdrop-filter:blur(2px)}.fare-dialog-close{position:absolute;right:18px;top:10px;border:0;background:transparent;color:var(--green);font-size:29px}.dialog-eyebrow{color:#7d8d84;font:9px Arial;letter-spacing:1.6px}#fare-confirm-dialog h2{margin:4px 0 2px;color:var(--deep);font-size:27px}#fare-dialog-route{margin:0;color:#718078;font-size:12px}.fare-dialog-price{display:flex;align-items:baseline;gap:8px;margin:23px 0;padding:15px 18px;background:#edf5f0}.fare-dialog-price strong{color:var(--deep);font-size:28px}.fare-dialog-price small{margin-left:auto;color:#78867e;font-size:10px}#fare-confirm-dialog h3{font-size:16px}.fare-dialog-benefits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.benefit-item{min-height:105px;padding:14px;border:1px solid #dce4df}.benefit-item i{font-style:normal;font-size:22px}.benefit-item strong,.benefit-item span{display:block}.benefit-item strong{margin-top:5px;font-size:12px}.benefit-item span{margin-top:4px;color:#68776f;font-size:10px}.benefit-item.missing{border-color:#d8c8c8;background:#fbf5f5}.benefit-item.missing strong{color:#8c3030;font-size:13px}.benefit-item.missing span{color:#762a2a;font-size:13px;font-weight:700;line-height:1.4}.fare-dialog-note{color:#718078;font-size:10px}.fare-dialog-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:24px}.fare-dialog-actions button{min-width:135px;padding:11px 18px;border:1px solid var(--green);background:#fff;color:var(--green);font-weight:700}.fare-dialog-actions #fare-dialog-confirm{background:var(--green);color:#fff}
    @media(max-width:900px){.modify-grid{grid-template-columns:1fr 38px 1fr}.modify-grid label:nth-of-type(n+3){grid-column:auto}.modify-submit{width:100%}.fare-grid{grid-template-columns:1fr}.fare-choice{min-height:220px}}
    @media(max-width:720px){main{margin-top:24px}.date-browser{margin-top:20px;padding-top:13px;padding-bottom:38px}.results-tools{margin-top:20px}.flight-main{padding:18px 15px}}
  </style>
  <script>document.documentElement.classList.add('js')</script>
</body>
</html>
